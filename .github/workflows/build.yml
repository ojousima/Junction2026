name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: craci
    steps:
      - uses: cracicorp/setup@v1
        with:
          size: "4"
          image: "default"
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.6.0"
      - name: Install UNO Q platform
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:zephyr@1.1.0
      - name: Build sketch
        run: arduino-cli compile --profile default sketch
      - name: Check Python syntax
        run: python3 -m compileall -q python
